# Environment for the user manager, and so for every service in the session --
# not just the shell. The GTK apps launched into it need the driver variables as
# much as mutter does.
#
# Read once, when the user manager starts. `systemctl --user show-environment`
# is the way to check what is actually in effect; install-units.sh pushes these
# in by hand so the first session does not need a logout.

# gnome-shell's unit carries AssertEnvironment=XDG_SESSION_TYPE=wayland, and
# that assert reads the *manager's* environment block -- not the unit's, and not
# the shell you type in. Nothing else sets it here: there is no display manager
# in this setup to establish a graphical logind session. This one line is what
# lets gnome-session@ubuntu.target start at all.
XDG_SESSION_TYPE=wayland

XDG_CURRENT_DESKTOP=GNOME

# We want GPU acceleration: the d3d12 Gallium driver, pointed at the adapter
# Windows exposes.
GALLIUM_DRIVER=d3d12

# MESA_D3D12_DEFAULT_ADAPTER_NAME is deliberately not set here. Unset, d3d12
# takes whatever adapter Windows lists first, which is the right answer on a
# machine with one GPU. On a hybrid laptop it may not be, so it is configurable
# rather than baked in: `install-units.sh --adapter intel` writes the choice to
# 20-weaselway-adapter.conf, read after this file, and
# `start-gnome-shell.sh --adapter nvidia` overrides it for a single session.
# The value is matched against a substring of the adapter description, so
# "intel" or "nvidia" is enough.

# Vulkan is experimental with d3d12/dzn, GL works fine.
GSK_RENDERER=gl
