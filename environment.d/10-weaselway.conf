# Environment for the user manager, and so for every service it runs: the
# desktop's own services, the applications started from it, and weaselwayd.
# start-session.sh gives the same driver variables to the session's unit.
#
# Read once, when the user manager starts. `systemctl --user show-environment`
# is the way to check what is actually in effect.

# We want GPU acceleration: the d3d12 Gallium driver, pointed at the adapter
# Windows exposes.
GALLIUM_DRIVER=d3d12

# MESA_D3D12_DEFAULT_ADAPTER_NAME is deliberately not set here. Unset, d3d12
# takes whatever adapter Windows lists first, which is the right answer on a
# machine with one GPU. On a hybrid laptop it may not be, so it is configurable
# rather than baked in: weaselway.adapter in configuration.nix writes the
# choice to 20-weaselway-adapter.conf, read after this file, and
# `start-session --adapter nvidia` overrides it for a single session. The
# value is matched against a substring of the adapter description, so "intel"
# or "nvidia" is enough.

# Vulkan is experimental with d3d12/dzn, GL works fine.
GSK_RENDERER=gl

# WebKit's bubblewrap sandbox binds /dev/dri into the web process but not
# /dev/dxg, which d3d12 (libdxcore) needs. Without it the web process gets no
# EGL display and aborts, so Epiphany, Yelp and the like show nothing. The
# fix is a --dev-bind-try /dev/dxg in WebKit's bindOpenGL(); until WebKit
# has it, web content runs unsandboxed.
WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

# The vsock port weaselwayd serves RDP on, and start-viewer.sh connects to.
# With one weaselway distro per WSL VM a fixed one does, and nothing else in
# the VM binds it (WSL's own listeners take random ports from the whole 32-bit
# range). Above 1023, since weaselwayd runs unprivileged.
WEASELWAY_VSOCK_PORT=3389
