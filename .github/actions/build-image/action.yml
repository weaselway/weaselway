name: Build the NixOS-WSL image
description: >
  Builds one of the image configurations (nixosConfigurations.wsl-gnome or
  wsl-plasma) and packs it with NixOS-WSL's tarball builder, leaving nixos.wsl
  in the workspace root.

inputs:
  desktop:
    description: The desktop the image carries, gnome or plasma.
    required: true
  cachix-auth-token:
    description: >
      Token for pushing to the weaselway Cachix cache. Without one (pull
      requests from forks get no secrets) the cache is only read from.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The closure is a whole desktop, and the builds that are not in the
    # binary cache (dxgdrm's kernel tree, mesa, mutter, gnome-shell, KWin and
    # what links it) need room of their own. The runner image ships far more
    # preinstalled SDKs than it has free space.
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
        df -h /

    - uses: cachix/install-nix-action@v31.11.1
      with:
        extra_nix_config: |
          max-jobs = auto

    # weaselway.cachix.org holds what cache.nixos.org doesn't: dxgdrm's kernel
    # tree, mesa, mutter, gnome-shell, KWin and the viewer. Every path this job
    # builds is pushed, so a run only compiles what changed since the last
    # one. The image points nix at the same cache (nix/module.nix), so
    # nixos-rebuild on a WSL machine downloads these too.
    - uses: cachix/cachix-action@v17
      with:
        name: weaselway
        authToken: ${{ inputs.cachix-auth-token }}

    # The builder is x86_64 like the runner, so everything is native here --
    # unlike on aarch64 machines, see ARCHITECTURE.md.
    - name: Build the system and the tarball builder
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        nix build --print-build-logs --out-link tarball-builder ".#tarballBuilder-${DESKTOP}"

    # nixos-install into a scratch root and tar it up, which needs root.
    - name: Pack nixos.wsl
      shell: bash
      run: |
        sudo ./tarball-builder/bin/nixos-wsl-tarball-builder nixos.wsl
        sudo chown "$(id -u):$(id -g)" nixos.wsl
        ls -lh nixos.wsl
