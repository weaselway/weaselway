# Builds the NixOS-WSL image (nixos.wsl) from flake.nix, see NIXOS.md.
name: Build NixOS-WSL image

# Pushes to main and pull requests; other branches can be built with
# workflow_dispatch. Tags are release-image.yml's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    # A run whose mesa/mutter/kernel inputs changed compiles them again; the
    # rest comes from weaselway.cachix.org.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: nixos-wsl-${{ github.sha }}
          path: nixos.wsl
          retention-days: 7
          if-no-files-found: error
          # nixos.wsl is already a gzipped tar.
          compression-level: 0
