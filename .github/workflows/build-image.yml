# Builds the NixOS-WSL images (nixos.wsl) from flake.nix, see ARCHITECTURE.md.
name: Build NixOS-WSL image

# Pushes to main and pull requests; other branches can be built with
# workflow_dispatch. Tags are release-image.yml's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What cache.nixos.org lacks, each part on a runner of its own and pushed to
  # weaselway.cachix.org, so that the images below only download it. Usually
  # all cached; after a nixpkgs bump that changes stdenv, everything here is
  # compiled again, the mingw toolchain under the viewer taking the longest.
  packages:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernel
            attrs: .#dxgdrm-all
          - name: viewer
            attrs: .#weaselway-viewer
          - name: mesa-freerdp
            attrs: .#weaselway-mesa .#weaselwayd
          - name: gnome
            attrs: .#gnome-shell .#gnome-control-center
          - name: plasma
            attrs: .#kwin .#plasma-workspace .#plasma-desktop
    name: packages (${{ matrix.name }})
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.attrs }}
        env:
          ATTRS: ${{ matrix.attrs }}
        run: |
          read -ra attrs <<< "${ATTRS}"
          nix build --print-build-logs --no-link "${attrs[@]}"

  build:
    needs: packages
    runs-on: ubuntu-26.04
    strategy:
      # One image failing to build says nothing about the other.
      fail-fast: false
      matrix:
        desktop: [gnome, plasma]
    # Whatever the packages job did not cover is compiled here; the rest comes
    # from weaselway.cachix.org.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          desktop: ${{ matrix.desktop }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: nixos-wsl-${{ matrix.desktop }}-${{ github.sha }}
          path: nixos.wsl
          # The shortest GitHub keeps an artifact for.
          retention-days: 1
          if-no-files-found: error
          # nixos.wsl is already a gzipped tar.
          compression-level: 0
