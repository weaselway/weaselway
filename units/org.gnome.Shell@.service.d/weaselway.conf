# The stock unit runs a plain `gnome-shell`, which expects a display manager to
# have set up a session and a real display to draw on. Ours has neither: it runs
# headless against a virtual monitor and serves the session over the vsock RDP
# port WSLGd published.
#
# This lives in the template's drop-in directory rather than an instance's, so
# it applies to every session the distro offers. That is worth more than it
# looks: the instance name is the gnome-shell *mode*, not the session name, and
# the three sessions on 26.04 ask for three different ones -- ubuntu.session
# wants @ubuntu, gnome.session wants @user, gnome-login.session wants @gdm. One
# file covers all of them; per-instance drop-ins would have to enumerate them.

[Unit]
# The render node and the shared-memory mount both come from
# weaselway-prep.service, which is a *system* unit -- the user manager cannot
# order itself against one, so assert on what that unit produces instead. Assert
# rather than Condition: if the prep did not run, silently skipping the shell
# would leave gnome-session@ubuntu.target looking like it came up fine.
AssertPathExists=/dev/dri/renderD128
AssertPathIsMountPoint=/mnt/wslg-shared-memory

[Service]
# MUTTER_RDP_VSOCK_PORT changes every boot, so it cannot live in environment.d
# with the static values; it is read straight from the file WSLGd wrote. No `-`
# prefix -- a missing file means the session cannot work at all, and failing
# here is far easier to read than mutter binding nothing and hanging.
#
# The file is written to be `source`d by bash, and systemd's parser is not bash:
# it eats the backslashes in the single-quoted WSLG_SHARED_MEMORY_OB_DIRECTORY.
# Harmless, because that one is for the FreeRDP client on the Windows side --
# start-viewer.sh reads the file with bash and gets it right. Mutter needs only
# MUTTER_RDP_VSOCK_PORT, which is a bare integer.
EnvironmentFile=/mnt/wslg/mutter-rdp.env

Environment=MUTTER_RDP=1

# Start Xwayland eagerly instead of on first X11 connection. Otherwise we get the
# ON_DEMAND policy, where mutter owns the X sockets and spawns Xwayland from the
# main loop -- and gnome-shell's startup JS blocks that same main loop on a
# synchronous xcb_connect() to it (Gvc.MixerControl -> PulseAudio -> X11 root
# window probe). See meta_context_main_get_x11_display_policy(); this env var is
# our patch.
Environment=MUTTER_X11_MANDATORY=1

# Must match SHARED_MEMORY_MOUNT_POINT in prep-session.sh.
Environment=WSL2_SHARED_MEMORY_MOUNT_POINT=/mnt/wslg-shared-memory

# WSL injects PULSE_SERVER=/mnt/wslg/PulseServer into the distro, pointing at
# the PulseAudio the stock WSLGd used to run. Ours does not run one at all --
# audio is PipeWire, and libpulse clients reach it through pipewire-pulse's
# socket in XDG_RUNTIME_DIR, which they find on their own when PULSE_SERVER is
# unset. Left set, every one of them instead tries a socket that is not there:
# not just applications, but gnome-shell's own volume control.
#
# It has to be unset rather than overridden -- environment.d can only assign,
# and libpulse does not reliably read an empty PULSE_SERVER as "use the
# default". install-units.sh does the same to the running user manager.
UnsetEnvironment=PULSE_SERVER

# The empty assignment is required: without it systemd appends to the stock
# ExecStart= rather than replacing it, and a unit with two of them is refused.
#
# --mode=%i is kept from the stock unit, and is what makes one drop-in serve
# every session: the instance name is the session mode, so starting
# gnome-session@gnome.target gets `--mode=gnome`. start-gnome-shell.sh never
# passed a mode at all, having run the shell outside the session plumbing
# entirely; starting a session target and then not loading the matching mode
# would be incoherent. It does mean session extensions now load -- if the shell
# fails on one, dropping this flag is the first thing to try.
#
# wayland-0 is named explicitly even though it is mutter's default. WSL injects
# WAYLAND_DISPLAY=wayland-0 into the manager environment and the forked WSLGd no
# longer starts a compositor to claim it, so the two agree for free -- but if a
# stale socket ever did sit there, auto-picking would quietly fall through to
# wayland-1 and point every session service at the wrong display.
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=%i --headless --virtual-monitor 1280x720 --wayland-display wayland-0
