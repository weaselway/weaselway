# The two ends of the RDP audio bridge, as plain PipeWire objects.
#
# Installed to ~/.config/pipewire/pipewire.conf.d/ by install-audio.sh. There is
# no PulseAudio here: the system distro stopped shipping it, and mutter's RDP
# backend now speaks a raw-PCM TCP protocol to the two servers below rather than
# the custom socket protocol the old module-rdp-sink/source implemented.
#
# The thing to understand before reading further: a protocol-simple server
# creates its stream per *connected client* (create_streams() runs from
# on_connect()), and mutter only connects while an RDP viewer is attached with
# audio negotiated. So anything built directly on one of these streams is a
# device that comes and goes with the viewer.
#
# That is fine for a microphone and not fine for speakers, so the two halves are
# built differently -- the sink gets a permanent null-audio-sink in front of it,
# the source does not. Both are explained at their definitions below.

context.objects = [
    # Desktop audio. Applications play into this; its monitor is what gets
    # forwarded to the RDP client.
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "weaselway_rdp_sink"
            node.description = "Remote Desktop Audio"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            audio.rate       = 44100
        }
    }

    # No equivalent object for the microphone -- see the second module below.
]

context.modules = [
    # Playback: desktop -> RDP client.
    #
    # Formats are fixed at load time (there is no negotiation in this protocol)
    # and must match rdp_audio_out_format in mutter's meta-rdp-audio.c:
    # WAVE_FORMAT_PCM, 2 channels, 44100Hz, 16 bits.
    {   name = libpipewire-module-protocol-simple
        args = {
            # capture = the server captures from the graph and writes it to the
            # client, which is mutter's audio-out direction.
            capture  = true
            playback = false

            audio.rate     = 44100
            audio.format   = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]

            # Loopback only. The user distro is the trust boundary here, the
            # same as the unix socket this replaced -- do not expose it to the
            # network.
            server.address = [ "tcp:127.0.0.1:4711" ]

            capture.props = {
                node.name = "weaselway-rdp-audio-out"

                # Drain the null sink's monitor rather than being a sink in our
                # own right. stream.capture.sink is what selects monitor ports.
                target.object       = "weaselway_rdp_sink"
                stream.capture.sink = true

                # If the sink ever goes away, fail rather than let the session
                # manager reattach us to some other device -- silently
                # forwarding the wrong audio is worse than forwarding none.
                node.dont-reconnect = true
            }
        }
    }

    # Capture: RDP client -> desktop.
    #
    # Matches rdp_audio_in_format: WAVE_FORMAT_PCM, 1 channel, 44100Hz, 16 bits.
    #
    # Unlike the sink, this device is *not* permanent -- media.class below makes
    # the per-client stream itself the source, so "Remote Desktop Microphone"
    # appears when mutter connects and goes away when it disconnects.
    #
    # That is deliberate, and it is also the only thing that works. A permanent
    # null-audio-sink with media.class = Audio/Source/Virtual does create a
    # node with input ports, but WirePlumber will not route a playback stream
    # to it: playback streams only ever link to an Audio/Sink, so the feed lands
    # on the default sink instead. (Verified -- even `pw-play --target=` on such
    # a node plays out of the speakers.) Feeding one anyway needs a loopback
    # through an intermediate Audio/Sink, which would show up in Settings as a
    # phantom output device.
    #
    # No great loss: a microphone that does not exist while no remote client is
    # attached is the honest answer, and applications cope with a mic appearing
    # and disappearing far better than with speakers doing it.
    {   name = libpipewire-module-protocol-simple
        args = {
            # playback = the client writes to the server and it plays into the
            # graph, which is mutter's audio-in (audin) direction.
            capture  = false
            playback = true

            audio.rate     = 44100
            audio.format   = S16LE
            audio.channels = 1
            audio.position = [ MONO ]

            server.address = [ "tcp:127.0.0.1:4712" ]

            playback.props = {
                node.name        = "weaselway_rdp_source"
                node.description = "Remote Desktop Microphone"
                media.class      = "Audio/Source"
            }
        }
    }
]
